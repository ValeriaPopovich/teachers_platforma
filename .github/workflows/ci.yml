name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Compiled styles
        run: npm run styles:check
      - name: Dependency architecture
        run: npm run refactor:check
      - name: Stage 0 validation
        run: npm run validate:stage0
      - name: Unit, integration and architecture tests
        run: npm test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Critical E2E
        run: npm run test:e2e
