<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Переход в TutRoom</title>
  </head>
  <body>
    <p>Открываем нужный раздел…</p>
    <script>
      (() => {
        const routes = new Set([
          '/dashboard',
          '/schedule',
          '/students',
          '/payments',
          '/reports',
          '/board',
          '/settings',
        ]);
        const path = location.pathname.replace(/\/+$/, '') || '/';
        if (routes.has(path)) {
          sessionStorage.setItem(
            'tutorCabinet_spaRedirect',
            `${location.pathname}${location.search}${location.hash}`,
          );
        }
        location.replace('/');
      })();
    </script>
  </body>
</html>
